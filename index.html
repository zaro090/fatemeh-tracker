<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#D4AF37">
<title>فاطمه ❤️</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;margin:0;padding:0}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:#f5f0e8;color:#333;display:flex;align-items:flex-start;justify-content:center;min-height:100vh;padding:8px}
.window{width:100%;max-width:480px;background:#fff;border-radius:12px;box-shadow:0 2px 20px rgba(0,0,0,.08);overflow:hidden;margin-top:10px}
.title-bar{background:linear-gradient(135deg,#D4AF37,#C9A030,#B8860B);padding:14px 18px;display:flex;justify-content:space-between;align-items:center;color:#fff;min-height:56px}
.title-name{font-size:18px;font-weight:700;text-shadow:0 1px 3px rgba(0,0,0,.2)}
.balance-badge{background:rgba(255,255,255,.2);padding:3px 14px;border-radius:14px;font-size:13px;border:1px solid rgba(255,255,255,.15)}
.content{padding:16px}
.btn{display:inline-block;border:0;border-radius:6px;padding:10px 14px;font-size:15px;font-weight:600;cursor:pointer;background:#e6e6e6;color:#333;width:100%;margin:5px 0;text-align:center;transition:all .15s;min-height:46px}
.btn:active{transform:scale(.97)}
.btn-main{background:linear-gradient(135deg,#D4AF37,#C9A030);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.15)}
.btn-main:active{background:#B8860B}
.btn-danger{background:#d13438;color:#fff}
.btn-danger:active{background:#b02b2e}
.btn-small{padding:6px 12px;font-size:13px;width:auto;display:inline-block;min-height:34px;margin:3px}
.btn-gold{background:linear-gradient(135deg,#D4AF37,#C9A030);color:#fff}
.btn-gold:active{background:#B8860B}
.full{width:100%}
.card{background:#faf8f5;border:1px solid #e8e0d5;border-radius:6px;padding:12px;margin:8px 0}
.section{margin:12px 0}
.section-title{font-size:15px;font-weight:700;color:#8B7500;margin-bottom:8px;border-right:3px solid #D4AF37;padding-right:8px}
input,textarea{width:100%;padding:10px 12px;margin:5px 0;border:1px solid #ddd;border-radius:6px;font-size:15px;font-family:inherit;background:#fff;transition:border .2s}
input:focus,textarea:focus{border-color:#D4AF37;outline:0;box-shadow:0 0 0 2px rgba(212,175,55,.15)}
textarea{min-height:50px;resize:vertical}
.item{background:#faf8f5;border:1px solid #e8e0d5;border-radius:6px;padding:10px;margin:6px 0;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;font-size:14px}
.item>div{flex:1;min-width:60px;margin:3px 0}
.item-actions{display:flex;gap:4px;flex-wrap:wrap}
.flex-row{display:flex;gap:6px;flex-wrap:wrap}
.flex-row .btn{flex:1;min-width:50px}
.footer{text-align:center;padding:10px 0 4px;border-top:1px solid #eee;font-size:11px;color:#999}
.hidden{display:none!important}
.toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:8px 20px;border-radius:8px;display:none;z-index:999;font-size:14px;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.back-btn{background:0;border:0;color:#B8860B;font-size:15px;font-weight:700;cursor:pointer;padding:6px 0;margin-bottom:4px}
.tag{display:inline-block;padding:2px 10px;border-radius:10px;font-size:12px;font-weight:600}
.tag-savings{background:#dff6dd;color:#107c10}
.tag-debt{background:#fce4e4;color:#a80000}
.main-menu-btn{padding:14px;font-size:16px;font-weight:700;min-height:52px;border-radius:8px;background:linear-gradient(135deg,#D4AF37,#C9A030);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.15)}
.main-menu-btn:active{background:#B8860B}
.section-balance{font-weight:700;color:#B8860B;background:#faf8f5;padding:5px 14px;border-radius:6px;display:inline-block;font-size:14px;border:1px solid #e8e0d5}
.receipt-box{background:#f5f0e8;border:1px solid #e0d5c8;border-radius:4px;padding:8px;margin:4px 0;font-size:13px;color:#444;max-height:200px;overflow-y:auto;white-space:pre-wrap;word-break:break-all}
.receipt-actions{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
.receipt-actions .btn{font-size:11px;padding:3px 8px;min-height:28px;width:auto;margin:2px}
.login-box{text-align:center;padding:30px 20px 40px}
.login-box input{width:100%;padding:12px;margin:12px 0;border:1px solid #ddd;border-radius:8px;font-size:18px;text-align:center;letter-spacing:2px}
.login-box input:focus{border-color:#D4AF37;outline:0;box-shadow:0 0 0 2px rgba(212,175,55,.15)}
.login-box .btn{width:100%;padding:12px;background:linear-gradient(135deg,#D4AF37,#C9A030);color:#fff;border:0;border-radius:8px;font-size:18px;font-weight:700;cursor:pointer;min-height:50px;text-shadow:0 1px 2px rgba(0,0,0,.15)}
.login-box .btn:active{background:#B8860B}
.login-box .error{color:#d13438;font-size:14px;margin-top:8px;display:none}
.login-box .lock-icon{font-size:56px;margin-bottom:8px;display:block}
</style>
</head>
<body>
<div class="window" id="app">
<div id="loginPage">
<div class="title-bar"><div class="title-name">✨ فاطمه ❤️</div></div>
<div class="content login-box">
<span class="lock-icon">❤️</span>
<p style="color:#8B7500;margin-bottom:14px;font-size:16px;font-weight:600;">رمز را وارد کنید</p>
<input type="password" id="passwordInput" placeholder="رمز عبور" maxlength="10" autofocus>
<button class="btn" onclick="checkPassword()">✨ ورود</button>
<div class="error" id="loginError">❌ رمز اشتباه است</div>
</div>
</div>
<div id="mainApp" class="hidden">
<div class="title-bar">
<div class="title-name">✨ فاطمه ❤️</div>
<div class="balance-badge" id="totalBalance"></div>
</div>
<div class="content" id="mainPage">
<div class="section">
<div class="section-title">📂 انتخاب بخش</div>
<button class="btn main-menu-btn" onclick="openSection('savings')">🏦 مدیریت قلک</button>
<button class="btn btn-danger main-menu-btn" onclick="openSection('debt')" style="background:linear-gradient(135deg,#d13438,#b02b2e);text-shadow:0 1px 2px rgba(0,0,0,.15)">📋 مدیریت بدهی</button>
</div>
<div class="section">
<div class="flex-row">
<button class="btn btn-small" onclick="exportData()">📤 خروجی</button>
<button class="btn btn-small" onclick="document.getElementById('importInput').click()">📥 ورودی</button>
<input type="file" id="importInput" accept=".json" style="display:none" onchange="importData(event)">
</div>
</div>
<div class="footer">✨ فاطمه ❤️</div>
</div>
<div class="content hidden" id="sectionPage">
<button class="back-btn" onclick="backToMain()">← بازگشت</button>
<div class="section">
<div class="section-title" id="sectionTitle">🏦 مدیریت قلک</div>
<div style="margin:6px 0"><span class="section-balance" id="sectionBalance">مجموع: ۰ ریال</span></div>
<input type="text" id="txDesc" placeholder="توضیح">
<input type="number" id="txAmount" placeholder="مبلغ (ریال)" min="0">
<textarea id="txReceipt" placeholder="رسید را بچسبانید..."></textarea>
<button class="btn btn-main full" onclick="addTransaction()">📌 ثبت</button>
</div>
<div class="section">
<div class="section-title">📋 تراکنش‌ها</div>
<div id="transactionsList"></div>
</div>
</div>
</div>
</div>
<div id="toast" class="toast"></div>
<script>
const PASSWORD = '3408';
let isLoggedIn = false;
let editingIndex = null;

function checkPassword() {
const input = document.getElementById('passwordInput').value;
const error = document.getElementById('loginError');
if(input === PASSWORD) {
isLoggedIn = true;
document.getElementById('loginPage').classList.add('hidden');
document.getElementById('mainApp').classList.remove('hidden');
history.replaceState({page:'main'},'');
updateBalances();
error.style.display = 'none';
document.getElementById('passwordInput').value = '';
} else {
error.style.display = 'block';
document.getElementById('passwordInput').value = '';
document.getElementById('passwordInput').focus();
}
}

document.getElementById('passwordInput').addEventListener('keydown', function(e) {
if(e.key === 'Enter') checkPassword();
});

const STORAGE_KEY='money_tracker';
let data=JSON.parse(localStorage.getItem(STORAGE_KEY))||{transactions:[]};
let currentSection='savings';

function saveData(){localStorage.setItem(STORAGE_KEY,JSON.stringify(data))}
function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(t._timer);t._timer=setTimeout(()=>{t.style.display='none'},2000)}
function money(v){return Number(v||0).toLocaleString('fa-IR')}

function getSectionBalance(type){return data.transactions.filter(t=>t.type===type).reduce((s,t)=>s+t.amount,0)}

function updateBalances(){
if(!isLoggedIn) return;
if(!document.getElementById('mainPage').classList.contains('hidden')){document.getElementById('totalBalance').textContent='';return}
document.getElementById('sectionBalance').textContent='مجموع: '+money(getSectionBalance(currentSection))+' ریال';
document.getElementById('totalBalance').textContent='';
}

function copyReceipt(text) {
navigator.clipboard.writeText(text).then(() => {
showToast('📋 رسید کپی شد');
}).catch(() => {
// راه حل جایگزین برای مرورگرهای قدیمی
const textarea = document.createElement('textarea');
textarea.value = text;
document.body.appendChild(textarea);
textarea.select();
document.execCommand('copy');
document.body.removeChild(textarea);
showToast('📋 رسید کپی شد');
});
}

function editTransaction(index) {
editingIndex = index;
const t = data.transactions[index];
document.getElementById('txDesc').value = t.desc;
document.getElementById('txAmount').value = t.amount;
document.getElementById('txReceipt').value = t.receipt || '';
document.getElementById('txDesc').focus();
showToast('✏️ در حال ویرایش... بعد از تغییر، دوباره ثبت کن');
}

function renderTransactions(){const list=document.getElementById('transactionsList');list.innerHTML='';const filtered=data.transactions.filter(t=>t.type===currentSection);if(!filtered.length){list.innerHTML='<div class="card" style="text-align:center;color:#888;">هیچ تراکنشی ثبت نشده</div>';updateBalances();return}
filtered.forEach((t,i)=>{const realIndex=data.transactions.indexOf(t);const div=document.createElement('div');div.className='item';const tagClass=t.type==='savings'?'tag-savings':'tag-debt';const tagName=t.type==='savings'?'قلک':'بدهی';let receiptHtml='';if(t.receipt){receiptHtml='<div class="receipt-box">📎 '+escapeHTML(t.receipt)+'</div><div class="receipt-actions"><button class="btn btn-small btn-gold" onclick="copyReceipt(\''+escapeHTML(t.receipt).replace(/'/g,"\\'")+'\')">📋 کپی</button></div>';}
div.innerHTML='<div><strong>'+escapeHTML(t.desc)+'</strong><br><span class="tag '+tagClass+'">'+tagName+'</span>'+receiptHtml+'</div><div>'+money(t.amount)+' ریال</div><div style="font-size:12px;color:#888;">'+escapeHTML(t.date||'')+'</div><div class="item-actions"><button class="btn btn-small btn-gold" onclick="editTransaction('+realIndex+')">✏️</button><button class="btn btn-small btn-danger" onclick="deleteTransaction('+realIndex+')">🗑</button></div>';list.appendChild(div)});updateBalances()}

function escapeHTML(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
function getTodayShamsi(){const d=new Date();return (d.getFullYear()-621)+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getDate()).padStart(2,'0')}
function openSection(type){currentSection=type;document.getElementById('mainPage').classList.add('hidden');document.getElementById('sectionPage').classList.remove('hidden');document.getElementById('sectionTitle').textContent=type==='savings'?'🏦 مدیریت قلک':'📋 مدیریت بدهی';renderTransactions();history.pushState({page:'section'},'')}
function backToMain(){document.getElementById('sectionPage').classList.add('hidden');document.getElementById('mainPage').classList.remove('hidden');history.replaceState({page:'main'},'');updateBalances()}
function addTransaction(){const desc=document.getElementById('txDesc').value.trim();const amount=parseInt(document.getElementById('txAmount').value);const receipt=document.getElementById('txReceipt').value.trim();if(!desc||!amount||amount<=0){showToast('❌ توضیح و مبلغ معتبر وارد کن');return}
if(editingIndex !== null && data.transactions[editingIndex]) {
data.transactions[editingIndex] = {...data.transactions[editingIndex], desc, amount, receipt: receipt||''};
editingIndex = null;
showToast('✅ ویرایش شد');
} else {
data.transactions.push({desc,amount,type:currentSection,date:getTodayShamsi(),receipt:receipt||''});
showToast('✅ ثبت شد');
}
saveData();renderTransactions();document.getElementById('txDesc').value='';document.getElementById('txAmount').value='';document.getElementById('txReceipt').value='';}
function deleteTransaction(idx){if(!confirm('مطمئن هستی؟'))return;data.transactions.splice(idx,1);saveData();renderTransactions();showToast('🗑 حذف شد')}
function exportData(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='transactions_'+new Date().toISOString().slice(0,10)+'.json';a.click();showToast('📤 خروجی آماده شد')}
function importData(event){const file=event.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=function(e){try{const imported=JSON.parse(e.target.result);if(!Array.isArray(imported.transactions))throw new Error();data=imported;saveData();if(!document.getElementById('mainPage').classList.contains('hidden'))updateBalances();else renderTransactions();showToast('✅ بارگذاری شد')}catch(err){showToast('❌ فایل نامعتبر')}};reader.readAsText(file);event.target.value=''}
window.addEventListener('popstate',function(){if(!document.getElementById('sectionPage').classList.contains('hidden'))backToMain()});
window.addEventListener('load',function(){if(!isLoggedIn){document.getElementById('loginPage').classList.remove('hidden');document.getElementById('mainApp').classList.add('hidden');document.getElementById('passwordInput').focus();}});
</script>
</body>
</html>
